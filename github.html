<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GitHub — Sanjay Kumar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favico.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="cursor-effects.css?v=4"/>
  <style>
    :root{--bg:#0a0a0b;--surface:#111114;--surface-2:#161618;--border:rgba(255,255,255,0.08);--border-mid:rgba(255,255,255,0.13);--text:#e8e8e8;--muted:#7a7a85;--subtle:#3a3a42;--max-w:1080px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}

    /* NAV */
    nav{position:sticky;top:0;z-index:100;background:rgba(10,10,11,0.88);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border)}
    .nav-inner{max-width:var(--max-w);margin:0 auto;padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
    .logo-mark{width:36px;height:36px;border:1px solid var(--border-mid);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:0.82rem;color:var(--text);background:var(--surface)}
    .logo-name{font-size:0.95rem;font-weight:600}
    .nav-links{display:flex;gap:0.25rem;list-style:none}
    .nav-links a{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-size:0.88rem;font-weight:500;padding:7px 13px;border-radius:8px;transition:color 0.2s,background 0.2s}
    .nav-links a:hover{color:var(--text);background:rgba(255,255,255,0.05)}
    .nav-links a.active{color:var(--text);background:rgba(255,255,255,0.08)}

    /* PAGE HEADER */
    .page-header{max-width:var(--max-w);margin:0 auto;padding:3.5rem 2rem 0;animation:fadeUp 0.4s ease both 0.05s}
    h1{font-size:2rem;font-weight:700;line-height:1.2;letter-spacing:-0.02em;color:var(--text);margin-bottom:0.5rem}
    .page-desc{font-size:0.95rem;color:var(--muted);max-width:64ch;line-height:1.8}

    /* MAIN */
    main{max-width:var(--max-w);margin:0 auto;padding:1.8rem 2rem 5rem;animation:fadeUp 0.4s ease both 0.1s}

    /* STATUS */
    .status{padding:0.75rem 1.1rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-family:'DM Mono',monospace;font-size:0.78rem;letter-spacing:0.03em;margin-bottom:1.5rem}

    /* STATS */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1.5rem}
    @media(max-width:560px){.stats{grid-template-columns:1fr}}
    .stat{background:var(--surface);padding:1.25rem 1rem;text-align:center;transition:background 0.2s}
    .stat:hover{background:var(--surface-2)}
    .stat .num{font-weight:700;font-size:1.75rem;color:var(--text);letter-spacing:-0.03em;font-family:'Inter',sans-serif}
    .stat .lbl{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:0.3rem}

    /* CONTROLS */
    .controls{display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem}
    .search-wrap{flex:1 1 280px;display:flex;align-items:center;gap:9px;padding:0.55rem 0.9rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:border-color 0.2s}
    .search-wrap:focus-within{border-color:var(--border-mid)}
    .search-wrap input{width:100%;border:none;outline:none;background:transparent;color:var(--text);font-size:0.88rem;font-family:'Inter',sans-serif}
    .search-wrap input::placeholder{color:var(--muted)}
    .search-wrap svg{color:var(--muted);flex:0 0 auto}

    /* SORT PILLS */
    .sort-pills{display:flex;gap:0.4rem;flex-wrap:wrap}
    .spill{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;padding:0.42rem 0.85rem;border-radius:8px;border:1px solid var(--border);color:var(--muted);background:transparent;cursor:pointer;transition:all 0.18s;white-space:nowrap}
    .spill:hover{color:var(--text);border-color:var(--border-mid);background:var(--surface-2)}
    .spill.active{color:var(--text);background:rgba(255,255,255,0.08);border-color:var(--border-mid)}

    /* REPO GRID */
    .repo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.5rem}
    @media(max-width:720px){.repo-grid{grid-template-columns:1fr}}

    /* REPO CARD */
    .repo{background:var(--surface);padding:1.4rem;display:flex;flex-direction:column;transition:background 0.2s;position:relative;overflow:hidden}
    .repo:hover{background:var(--surface-2)}
    .repo::after{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:rgba(255,255,255,0.1);opacity:0;transition:opacity 0.3s}
    .repo:hover::after{opacity:1}

    .repo-top{display:flex;gap:11px;align-items:flex-start;margin-bottom:0.85rem}
    .repo-icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.05);display:grid;place-items:center;color:var(--text);flex:0 0 auto}

    .repo-title-wrap{min-width:0;flex:1}
    .repo-title-wrap h3{font-size:0.95rem;font-weight:600;color:var(--text);letter-spacing:-0.01em;margin-bottom:0.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .repo-meta{display:flex;gap:0.75rem;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);letter-spacing:0.03em}
    .repo-meta span{display:flex;align-items:center;gap:4px}

    .repo-desc{font-size:0.875rem;color:var(--muted);line-height:1.7;flex:1;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

    .tag-row{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:1rem}
    .tag{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);padding:0.22rem 0.55rem;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,0.03);display:inline-flex;align-items:center;gap:4px}

    .repo-actions{margin-top:auto;padding-top:0.85rem;border-top:1px solid var(--border)}
    .btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;padding:0.42rem 0.85rem;border-radius:8px;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.18s;cursor:pointer;white-space:nowrap}
    .btn:hover{color:var(--text);border-color:var(--border-mid);background:var(--surface-2)}
    .btn-primary{background:rgba(255,255,255,0.08);color:var(--text);border-color:var(--border-mid)}
    .btn-primary:hover{background:rgba(255,255,255,0.13)}

    /* VISIT ROW */
    .visit-row{display:flex;align-items:center;gap:12px}

    /* FOOTER */
    footer{border-top:1px solid var(--border);padding:2.5rem 2rem;background:var(--bg)}
    .footer-inner{max-width:var(--max-w);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
    .footer-links{display:flex;gap:0.65rem}
    .footer-links a{width:42px;height:42px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);text-decoration:none;transition:background 0.2s,color 0.2s,border-color 0.2s}
    .footer-links a:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-mid)}
    .footer-copy{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--subtle);letter-spacing:0.05em}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:680px){h1{font-size:1.6rem}.page-header{padding:2.5rem 1.2rem 0}main{padding-left:1.2rem;padding-right:1.2rem}.nav-inner{padding:0 1.2rem}}
    @media(max-width:480px){.nav-links a span{display:none}}
  </style>

  <script>
    const GITHUB_USER = "sanjaybhattoo";
    const MAX_REPOS = 6;
    const FEATURED_REPO_NAMES = ["Data_Mining_Exploration","Kafka_Spark_Streaming_Examples","Project-Old-CarPrice-prediction","CharacterCountD3"];

    const statusEl    = document.getElementById("status");
    const repoListEl  = document.getElementById("repoList");
    const statRepos   = document.getElementById("statRepos");
    const statFollowers = document.getElementById("statFollowers");
    const statFollowing = document.getElementById("statFollowing");
    const pills       = Array.from(document.querySelectorAll(".spill"));
    const searchInput = document.getElementById("searchInput");

    let allRepos = [];
    let activeSort = "relevant";

    function fmtCompact(n){ return typeof n!=="number"?"—":new Intl.NumberFormat(undefined,{notation:"compact"}).format(n) }
    function fmtDate(iso){ const d=new Date(iso); return Number.isNaN(d.getTime())?"":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) }
    function daysSince(iso){ const d=new Date(iso); if(Number.isNaN(d.getTime()))return 999999; return Math.max(0,Math.floor((Date.now()-d.getTime())/(1000*60*60*24))) }
    function normalize(s){ return (s||"").toLowerCase().trim() }

    function pickIconSvg(repo){
      const hay = normalize(repo.name)+" "+normalize(repo.description);
      if(hay.includes("kafka")||hay.includes("stream")) return `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>`;
      if(hay.includes("spark")||hay.includes("pyspark")) return `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>`;
      if(hay.includes("etl")||hay.includes("data")||hay.includes("pipeline")||hay.includes("warehouse")) return `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7.58 3 4 4.79 4 7s3.58 4 8 4 8-1.79 8-4-3.58-4-8-4zM4 9v3c0 2.21 3.58 4 8 4s8-1.79 8-4V9c0 2.21-3.58 4-8 4S4 11.21 4 9zm0 5v3c0 2.21 3.58 4 8 4s8-1.79 8-4v-3c0 2.21-3.58 4-8 4s-8-1.79-8-4z"/></svg>`;
      if(hay.includes("ml")||hay.includes("llm")||hay.includes("rag")||hay.includes("nlp")) return `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2zm-5 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm10 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>`;
      if(hay.includes("aws")||hay.includes("azure")||hay.includes("cloud")) return `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>`;
      return `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>`;
    }

    function relevanceScore(repo){
      const stars=repo.stargazers_count||0, forks=repo.forks_count||0, watchers=repo.watchers_count||0;
      const ds=daysSince(repo.pushed_at||repo.updated_at);
      const recency=ds<=7?18:ds<=30?12:ds<=90?7:ds<=180?4:0;
      const hasDesc=(repo.description&&repo.description.trim().length>20)?6:0;
      const hay=normalize(repo.name)+" "+normalize(repo.description);
      const kws=[["kafka",10],["spark",10],["pyspark",10],["airflow",9],["etl",9],["pipeline",9],["stream",8],["warehouse",8],["aws",8],["azure",7],["kubernetes",7],["docker",6],["llm",8],["rag",8],["ml",6],["nlp",6]];
      let kw=0; for(const[k,w] of kws) if(hay.includes(k)) kw+=w;
      const featured=FEATURED_REPO_NAMES.includes(repo.name)?40:0;
      return (stars*3)+(forks*2)+(watchers)+recency+hasDesc+kw+featured;
    }

    function repoCard(repo){
      const el=document.createElement("article");
      el.className="repo";
      el.innerHTML=`
        <div class="repo-top">
          <div class="repo-icon" aria-hidden="true">${pickIconSvg(repo)}</div>
          <div class="repo-title-wrap">
            <h3 title="${(repo.name||"").replace(/"/g,'&quot;')}">${repo.name||"repo"}</h3>
            <div class="repo-meta">
              <span><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>${fmtDate(repo.updated_at)}</span>
              <span><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>${repo.language||"—"}</span>
            </div>
          </div>
        </div>
        <div class="repo-desc">${repo.description||"No description provided."}</div>
        <div class="tag-row">
          <span class="tag"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${repo.stargazers_count||0}</span>
          <span class="tag"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M17 1l-5.5 5.5L6 1H2l10 10L2 21h4l5.5-5.5L17 21h4L11 11 21 1z"/></svg>${repo.forks_count||0}</span>
          <span class="tag"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>${repo.watchers_count||0}</span>
        </div>
        <div class="repo-actions">
          <a class="btn" href="${repo.html_url||"#"}" target="_blank" rel="noreferrer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.605-3.369-1.34-3.369-1.34-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
            View Code
          </a>
        </div>`;
      return el;
    }

    function applyRender(){
      const q=normalize(searchInput.value);
      let repos=[...allRepos].filter(r=>!r.fork);
      if(q) repos=repos.filter(r=>(normalize(r.name)+" "+normalize(r.description)+" "+normalize(r.language)).includes(q));
      if(activeSort==="updated") repos.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
      else if(activeSort==="stars") repos.sort((a,b)=>(b.stargazers_count||0)-(a.stargazers_count||0));
      else repos.sort((a,b)=>relevanceScore(b)-relevanceScore(a));
      repos=repos.slice(0,MAX_REPOS);
      repoListEl.innerHTML="";
      repos.forEach(r=>repoListEl.appendChild(repoCard(r)));
      const label=activeSort==="updated"?"recently updated":activeSort==="stars"?"most starred":"featured";
      statusEl.textContent=`Showing ${repos.length} ${label} repos from @${GITHUB_USER}.`;
    }

    async function fetchJson(url){
      const r=await fetch(url,{headers:{"Accept":"application/vnd.github+json"}});
      if(!r.ok) throw new Error("GitHub API error "+r.status);
      return r.json();
    }

    async function loadGitHub(){
      try{
        const user=await fetchJson(`https://api.github.com/users/${GITHUB_USER}`);
        statRepos.textContent=fmtCompact(user.public_repos);
        statFollowers.textContent=fmtCompact(user.followers);
        statFollowing.textContent=fmtCompact(user.following);
        allRepos=await fetchJson(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated`);
        applyRender();
      }catch(err){
        statusEl.innerHTML=`Couldn't load GitHub data. <b>${(err&&err.message)?err.message:"Unknown error"}</b>`;
      }
    }

    pills.forEach(p=>p.addEventListener("click",()=>{
      pills.forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      activeSort=p.dataset.sort||"relevant";
      applyRender();
    }));
    searchInput.addEventListener("input",applyRender);
    loadGitHub();
  </script>
  <script src="cursor-effects.js?v=4"></script>
</body>
</html>
