<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GitHub - Sanjay Kumar</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="cursor-effects.css?v=4" />

  <style>
    :root{
      --max-w: 1100px;

      --bg:#000;
      --bg-soft:#070707;

      --card: rgba(17,17,17,0.82);
      --glass: rgba(0,0,0,0.75);

      --text:#f5f5f5;
      --muted:#9ca3af;

      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.16);

      --shadow: 0 22px 70px rgba(0,0,0,0.75);
      --radius: 16px;

      --accent:#ffffff;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x:hidden;
    }

    /* ---------------- NAV ---------------- */
    nav{
      position:sticky;top:0;z-index:1000;
      background:var(--glass);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }
    .nav-container{
      max-width:var(--max-w);
      margin:0 auto;
      padding:1.2rem 1.5rem;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .logo{
      display:inline-flex;align-items:center;gap:12px;
      text-decoration:none;color:var(--text);font-weight:900;
    }
    .brand-mark{
      width:40px;height:40px;border-radius:12px;
      border:1px solid var(--border);
      display:grid;place-items:center;
      background:#0f0f0f;
      font-weight:900;
    }
    .nav-links{display:flex;gap:1rem;list-style:none;align-items:center;flex-wrap:wrap}
    .nav-links a{
      display:inline-flex;align-items:center;gap:8px;
      text-decoration:none;color:var(--muted);
      padding:6px 10px;border-radius:10px;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }
    .nav-links a:hover{color:var(--text); background:rgba(255,255,255,0.08); transform:translateY(-2px)}
    .nav-links a.active{color:var(--text); background:rgba(255,255,255,0.10)}
    .nav-links i{font-size:0.95rem}

    /* ---------------- PAGE ---------------- */
    .container{max-width:var(--max-w);margin:0 auto;padding:3.2rem 1.5rem 2.5rem}
    h1{font-size:2.2rem;line-height:1.15;margin-bottom:.55rem}
    .subhead{color:var(--muted);max-width:75ch;margin-bottom:1.25rem;line-height:1.75}

    .status{
      margin-top:1rem;
      padding:1rem;
      border:1px solid var(--border);
      border-radius:14px;
      background: rgba(255,255,255,0.05);
      color:var(--muted);
      backdrop-filter: blur(12px);
    }

    /* ---------------- STATS ---------------- */
    .stats{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.25rem;
    }
    @media (max-width:720px){
      .stats{ grid-template-columns: 1fr; }
    }
    .stat{
      background: rgba(255,255,255,0.05);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      text-align:center;
      backdrop-filter: blur(14px);
    }
    .stat .num{font-weight:900;font-size:1.6rem;color:rgba(255,255,255,0.92)}
    .stat .lbl{color:var(--muted);font-weight:900;margin-top:.25rem}

    /* ---------------- CONTROLS ---------------- */
    .controls{
      display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;
      margin: 1.35rem 0 1.1rem;
    }
    .search{
      flex: 1 1 320px;
      display:flex;align-items:center;gap:10px;
      padding:.7rem .9rem;
      border:1px solid var(--border);
      border-radius:14px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      backdrop-filter: blur(12px);
    }
    .search i{color:var(--muted)}
    .search input{
      width:100%;
      border:none;outline:none;
      background:transparent;
      color:var(--text);
      font-size:.98rem;
    }
    .pill-row{display:flex;gap:.55rem;flex-wrap:wrap}
    .pill{
      border:1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      padding:.5rem .75rem;
      border-radius:999px;
      cursor:pointer;user-select:none;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
      display:inline-flex;align-items:center;gap:8px;
      font-weight:900;font-size:.9rem;
    }
    .pill:hover{transform:translateY(-2px); color:var(--text); background: rgba(255,255,255,0.08)}
    .pill.active{
      color: var(--text);
      background: rgba(255,255,255,0.10);
      border-color: var(--border-strong);
    }

    /* ---------------- REPO GRID ---------------- */
    .repo-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
      align-items: stretch;
    }
    @media (max-width: 860px){
      .repo-grid{ grid-template-columns: 1fr; }
    }

    /* ---------------- REPO CARD ---------------- */
    .repo{
      position:relative;
      border:1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.05rem 1.05rem 1rem;
      transition: transform 220ms ease, border-color 220ms ease;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 0;
      backdrop-filter: blur(16px);
    }
    .repo::before{
      content:"";
      position:absolute;
      inset:-90px;
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.10), transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(255,255,255,0.06), transparent 60%);
      opacity:0;
      transition: opacity 260ms ease;
      pointer-events:none;
    }
    .repo:hover{
      transform: translateY(-8px);
      border-color: var(--border-strong);
    }
    .repo:hover::before{ opacity: 1; }

    .repo-top{display:flex;gap:12px;align-items:flex-start}
    .repo-icon{
      width:44px;height:44px;border-radius:12px;
      display:grid;place-items:center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
      flex:0 0 auto;
    }

    .repo-title{min-width:0;flex:1}
    .repo-title h3{
      margin:0;
      font-size:1.03rem;
      line-height:1.25;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .repo-meta{
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
      color: var(--muted);
      font-weight:900;
      font-size:.86rem;
      margin-top: 4px;
    }

    /* Clamp description so card stays compact */
    .repo-desc{
      color: rgba(255,255,255,0.70);
      font-size:.93rem;
      line-height: 1.65;
      margin-top:.75rem;

      display:-webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }

    .tag-row{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      margin-top: .85rem;
    }
    .tag{
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.75);
      padding:.22rem .55rem;
      border-radius:999px;
      font-size:.78rem;
      font-weight:900;
    }

    .actions{
      display:flex;
      gap:.55rem;
      flex-wrap:wrap;
      margin-top: auto;
      padding-top: .9rem;
    }

    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:.48rem .75rem;border-radius:10px;
      border:1px solid var(--border);
      text-decoration:none;color:var(--text);
      background: rgba(255,255,255,0.05);
      font-weight:900;
      font-size:.9rem;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn:hover{
      transform:translateY(-2px);
      background: rgba(255,255,255,0.08);
      border-color: var(--border-strong);
    }
    .btn-primary{
      background:#fff;
      color:#000;
      border-color:transparent;
    }
    .btn-primary:hover{ background:#eaeaea; }

    /* ---------------- FOOTER ---------------- */
    footer{
      border-top: 1px solid var(--border);
      margin-top: 3.5rem;
      padding: 3rem 1.5rem;
      background: var(--bg-soft);
    }
    .footer-content.footer-center-icons{
      max-width: var(--max-w);
      margin: 0 auto;
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 14px;
    }
    .footer-content.footer-center-icons a{
      width:56px;height:56px;border-radius:14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,0.05);
      display:flex;align-items:center;justify-content:center;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      text-decoration:none;
    }
    .footer-content.footer-center-icons a:hover{
      transform: translateY(-3px);
      background: rgba(255,255,255,0.09);
      border-color: var(--border-strong);
    }
    .footer-content.footer-center-icons i{
      font-size: 1.15rem;
      color: rgba(255,255,255,0.92);
      transition: transform 420ms ease;
    }
    .footer-content.footer-center-icons a:hover i{ transform: rotate(720deg); }

    @media (prefers-reduced-motion: reduce){
      .footer-content.footer-center-icons i{ transition:none; }
      .footer-content.footer-center-icons a:hover i{ transform:none; }
    }

    @media (max-width:640px){
      h1{font-size:1.65rem}
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-container">
      <a class="logo" href="github.html">
        <span class="brand-mark">SK</span>
        <span>GitHub</span>
      </a>

      <ul class="nav-links" aria-label="Primary navigation">
        <li><a href="index.html"><i class="fa-solid fa-user"></i> About</a></li>
        <li><a href="experiences.html"><i class="fa-solid fa-briefcase"></i> Experiences</a></li>
        <li><a href="projects.html"><i class="fa-solid fa-code"></i> Projects</a></li>
        <li><a href="medium.html"><i class="fa-regular fa-file-lines"></i> Blog</a></li>
        <li><a class="active" href="github.html"><i class="fa-brands fa-github"></i> GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <header>
      <h1>Open-source</h1>
      <p class="subhead">
        Repositories (ranked by recency + data/cloud keywords).
      </p>
      <div class="status" id="status">Loading GitHub data…</div>
    </header>

    <section class="stats" aria-label="GitHub stats">
      <div class="stat"><div class="num" id="statRepos">—</div><div class="lbl">Public Repos</div></div>
      <div class="stat"><div class="num" id="statFollowers">—</div><div class="lbl">Followers</div></div>
      <div class="stat"><div class="num" id="statFollowing">—</div><div class="lbl">Following</div></div>
    </section>

    <div class="controls" aria-label="Repo controls">
      <div class="search" role="search" aria-label="Search repositories">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="text" placeholder="Search repos (Kafka, Spark, AWS, LLM, etc.)" />
      </div>

      <div class="pill-row" aria-label="Sort repositories">
        <button class="pill active" data-sort="relevant"><i class="fa-solid fa-star"></i> Featured</button>
        <button class="pill" data-sort="updated"><i class="fa-regular fa-clock"></i> Recently Updated</button>
        <button class="pill" data-sort="stars"><i class="fa-solid fa-fire"></i> Most Starred</button>
      </div>
    </div>

    <section aria-label="Repositories" class="repo-grid" id="repoList"></section>

    <div style="margin-top:1.25rem">
      <a class="btn btn-primary" href="https://github.com/sanjaybhattoo" target="_blank" rel="noreferrer">
        <i class="fa-brands fa-github"></i> Visit Profile
      </a>
    </div>
  </main>

  <footer>
    <div class="footer-content footer-center-icons">
      <a href="https://github.com/sanjaybhattoo" target="_blank" rel="noreferrer" title="GitHub" aria-label="GitHub" style="color:inherit">
        <i class="fab fa-github"></i>
      </a>
      <a href="mailto:bhattoo70@gmail.com" title="Email" aria-label="Email" style="color:inherit">
        <i class="fas fa-envelope"></i>
      </a>
      <a href="https://www.linkedin.com/in/sanjay-bhattoo/" title="LinkedIn" aria-label="LinkedIn" style="color:inherit">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://medium.com/feed/@bhattoo70" title="Medium" aria-label="Medium" style="color:inherit">
        <i class="fab fa-medium"></i>
      </a>
    </div>
  </footer>

  <script>
    const GITHUB_USER = "sanjaybhattoo";
    const MAX_REPOS = 6;

    // Optional: if you have "flagship" repos, list them here to force a boost.
    // Example: ["real-time-pipeline", "llm-rag-assistant"]
    const FEATURED_REPO_NAMES = ["Data_Mining_Exploration", "Kafka_Spark_Streaming_Examples", "Project-Old-CarPrice-prediction", "CharacterCountD3"];

    const statusEl = document.getElementById("status");
    const repoListEl = document.getElementById("repoList");
    const statRepos = document.getElementById("statRepos");
    const statFollowers = document.getElementById("statFollowers");
    const statFollowing = document.getElementById("statFollowing");

    const pills = Array.from(document.querySelectorAll(".pill"));
    const searchInput = document.getElementById("searchInput");

    let allRepos = [];
    let activeSort = "relevant";

    function fmtCompact(n){
      if(typeof n !== "number") return "—";
      return new Intl.NumberFormat(undefined,{notation:"compact"}).format(n);
    }
    function fmtDate(iso){
      const d = new Date(iso);
      if(Number.isNaN(d.getTime())) return "";
      return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
    }
    function daysSince(iso){
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return 999999;
      const ms = Date.now() - d.getTime();
      return Math.max(0, Math.floor(ms / (1000*60*60*24)));
    }
    function normalize(s){ return (s || "").toLowerCase().trim(); }

    function pickIcon(repo){
      const name = normalize(repo.name);
      const desc = normalize(repo.description);
      const hay = name + " " + desc;

      if(hay.includes("kafka") || hay.includes("stream")) return "fa-bolt";
      if(hay.includes("spark") || hay.includes("pyspark")) return "fa-bolt";
      if(hay.includes("etl") || hay.includes("warehouse") || hay.includes("data") || hay.includes("pipeline")) return "fa-database";
      if(hay.includes("airflow") || hay.includes("dag")) return "fa-diagram-project";
      if(hay.includes("docker") || hay.includes("k8") || hay.includes("kubernetes")) return "fa-cubes";
      if(hay.includes("ml") || hay.includes("llm") || hay.includes("rag") || hay.includes("nlp")) return "fa-wand-magic-sparkles";
      if(hay.includes("aws") || hay.includes("azure") || hay.includes("gcp") || hay.includes("cloud")) return "fa-cloud";
      return "fa-code";
    }

    // Relevance scoring:
    // - Stars/forks/watchers = impact signals
    // - Recent push = "alive"
    // - Description present + keyword boosts = "portfolio relevance"
    function relevanceScore(repo){
      const stars = repo.stargazers_count || 0;
      const forks = repo.forks_count || 0;
      const watchers = repo.watchers_count || 0;

      const ds = daysSince(repo.pushed_at || repo.updated_at);
      const recencyBoost =
        ds <= 7  ? 18 :
        ds <= 30 ? 12 :
        ds <= 90 ? 7  :
        ds <= 180? 4  : 0;

      const hasDescBoost = (repo.description && repo.description.trim().length > 20) ? 6 : 0;

      const hay = normalize(repo.name) + " " + normalize(repo.description);
      const keywordBoosts = [
        ["kafka", 10], ["spark", 10], ["pyspark", 10], ["airflow", 9],
        ["etl", 9], ["pipeline", 9], ["stream", 8], ["warehouse", 8],
        ["aws", 8], ["azure", 7], ["kubernetes", 7], ["docker", 6],
        ["llm", 8], ["rag", 8], ["ml", 6], ["nlp", 6],
        ["observability", 6], ["terraform", 6], ["ci/cd", 5], ["cicd", 5]
      ];

      let kw = 0;
      for (const [k, w] of keywordBoosts){
        if (hay.includes(k)) kw += w;
      }

      const featuredBoost = FEATURED_REPO_NAMES.includes(repo.name) ? 40 : 0;

      // Weighted impact: stars matter most, forks next, watchers light signal
      return (stars * 3) + (forks * 2) + (watchers * 1) + recencyBoost + hasDescBoost + kw + featuredBoost;
    }

    function repoCard(repo){
      const icon = pickIcon(repo);

      const name = repo.name || "repo";
      const desc = repo.description || "No description provided.";
      const lang = repo.language || "Unknown";
      const stars = repo.stargazers_count || 0;
      const forks = repo.forks_count || 0;
      const updated = fmtDate(repo.updated_at);
      const url = repo.html_url;

      const el = document.createElement("article");
      el.className = "repo";
      el.innerHTML = `
        <div class="repo-top">
          <div class="repo-icon" aria-hidden="true"><i class="fa-solid ${icon}"></i></div>
          <div class="repo-title">
            <h3 title="${name.replace(/"/g,'&quot;')}">${name}</h3>
            <div class="repo-meta">
              <span><i class="fa-regular fa-calendar"></i> Updated ${updated}</span>
              <span><i class="fa-solid fa-code"></i> ${lang}</span>
            </div>
          </div>
        </div>

        <div class="repo-desc">${desc}</div>

        <div class="tag-row" aria-label="Repo stats">
          <span class="tag"><i class="fa-solid fa-star"></i> ${stars}</span>
          <span class="tag"><i class="fa-solid fa-code-branch"></i> ${forks}</span>
          <span class="tag"><i class="fa-solid fa-eye"></i> ${repo.watchers_count || 0}</span>
        </div>

        <div class="actions">
          <a class="btn" href="${url}" target="_blank" rel="noreferrer">
            <i class="fa-brands fa-github"></i> Code
          </a>
        </div>
      `;
      return el;
    }

    async function fetchJson(url){
      const r = await fetch(url, {
        headers: {
          "Accept": "application/vnd.github+json",
        }
      });
      if(!r.ok) throw new Error("GitHub API error " + r.status);
      return r.json();
    }

    function applyRender(){
      const q = normalize(searchInput.value);

      let repos = [...allRepos].filter(r => !r.fork);

      // Search match
      if (q){
        repos = repos.filter(r => {
          const hay = normalize(r.name) + " " + normalize(r.description) + " " + normalize(r.language);
          return hay.includes(q);
        });
      }

      // Sort
      if (activeSort === "updated"){
        repos.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
      } else if (activeSort === "stars"){
        repos.sort((a,b) => (b.stargazers_count||0) - (a.stargazers_count||0));
      } else {
        repos.sort((a,b) => relevanceScore(b) - relevanceScore(a));
      }

      repos = repos.slice(0, MAX_REPOS);

      repoListEl.innerHTML = "";
      repos.forEach(r => repoListEl.appendChild(repoCard(r)));

      const label =
        activeSort === "updated" ? "recently updated" :
        activeSort === "stars" ? "most starred" :
        "featured (most relevant)";

      statusEl.textContent = `Showing ${repos.length} ${label} repos from @${GITHUB_USER}.`;
    }

    async function loadGitHub(){
      try{
        const user = await fetchJson(`https://api.github.com/users/${GITHUB_USER}`);
        statRepos.textContent = fmtCompact(user.public_repos);
        statFollowers.textContent = fmtCompact(user.followers);
        statFollowing.textContent = fmtCompact(user.following);

        // pull a larger set and rank locally
        allRepos = await fetchJson(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated`);

        applyRender();
      }catch(err){
        statusEl.innerHTML =
          `Couldn’t load GitHub data right now.<br><b>${(err && err.message) ? err.message : "Unknown error"}</b>`;
      }
    }

    pills.forEach(p => {
      p.addEventListener("click", () => {
        pills.forEach(x => x.classList.remove("active"));
        p.classList.add("active");
        activeSort = p.dataset.sort || "relevant";
        applyRender();
      });
    });

    searchInput.addEventListener("input", applyRender);

    loadGitHub();
  </script>

  <script src="cursor-effects.js?v=4"></script>
</body>
</html>
